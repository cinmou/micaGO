			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Bundle Go Backend";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Build the Go relay binary into the app bundle's Resources so the\n# companion can launch a bundled backend (no runtime download).\nSERVER_DIR=\"$SRCROOT/../micago-server\"\nDEST_DIR=\"${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}\"\nDEST=\"${DEST_DIR}/micago\"\nif command -v go >/dev/null 2>&1 && [ -d \"$SERVER_DIR\" ]; then\n  mkdir -p \"$DEST_DIR\"\n  rm -f \"$DEST\"\n  COMMIT=$(cd \"$SERVER_DIR\" && git rev-parse --short HEAD 2>/dev/null || echo unknown)\nBUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)\nif ( cd \"$SERVER_DIR\" && GOCACHE=\"$SERVER_DIR/.gocache\" go build -ldflags \"-X micagoserver/internal/version.Commit=$COMMIT -X micagoserver/internal/version.BuildTime=$BUILD_TIME\" -o \"$DEST\" ./cmd/micago ); then\n    chmod +x \"$DEST\"\n    echo \"bundled micago backend -> $DEST\"\n  else\n    echo \"warning: go build failed; companion will use a user or default backend path\"\n  fi\nelse\n  echo \"warning: go or micago-server not found; companion will use a user or default backend path\"\nfi\n\n# Bundle the MicaGo IMCore helper (edit / unsend / delete) into Resources so the\n# Companion's Install button has a real binary to install. dlopen's IMCore at\n# runtime, so only Foundation needs linking.\nHELPER_SRC=\"$SRCROOT/helper/micago-imcore-helper.m\"\nHELPER_DEST=\"${DEST_DIR}/micago-imcore-helper\"\nif [ -f \"$HELPER_SRC\" ]; then\n  mkdir -p \"$DEST_DIR\"\n  if clang -fobjc-arc -mmacosx-version-min=12.0 -framework Foundation -o \"$HELPER_DEST\" \"$HELPER_SRC\"; then\n    chmod +x \"$HELPER_DEST\"\n    echo \"bundled imcore helper -> $HELPER_DEST\"\n  else\n    echo \"warning: imcore helper build failed; Edit/Unsend/Delete will be unavailable\"\n  fi\nelse\n  echo \"warning: imcore helper source not found at $HELPER_SRC\"\nfi\nexit 0\n";
		};
/* End PBXShellScriptBuildPhase section */


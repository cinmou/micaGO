name: mica_go
description: "MicaGo Android client — connect to a MicaGo relay server."
publish_to: 'none'

version: 0.91.0+91

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Locale-aware date/time formatting (already in the tree via
  # flutter_localizations; declared directly so we can import it).
  intl: ^0.20.2
  # C78: AsyncCache.ephemeral() — first-party in-flight request dedup.
  async: ^2.13.0
  characters: ^1.4.0
  html: ^0.15.6
  crypto: ^3.0.7 # Dart team SHA-256 implementation for TLS certificate pins.
  http: ^1.6.0
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^10.3.4
  micago_conversations:
    path: packages/micago_conversations
  micago_credential_storage:
    path: packages/micago_credential_storage
  go_router: ^17.3.0
  provider: ^6.1.5+1
  mobile_scanner: ^7.2.0
  just_audio: ^0.10.5
  record: ^6.1.1
  flutter_contacts: ^2.2.1
  dynamic_color: ^1.8.1
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.1
  path: ^1.9.1
  path_provider: ^2.1.5
  file_picker: ^8.1.4
  open_filex: ^4.4.0
  share_plus: ^10.0.2
  image_picker: ^1.1.2
  photo_manager: ^3.6.4
  # C53: read the real device name (iOS: user-set name; Android: brand + model)
  # so the Companion's Paired Devices list shows the device instead of a generic
  # "micaGO on android" label.
  device_info_plus: ^11.3.0
  # C22: BlueBubbles-style FCM wake + local notifications. Firebase is initialized
  # at runtime from server-provided client config (no google-services.json baked
  # in) and is fully optional — absent config degrades to WebSocket + delta sync.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  # C24: in-app full-screen video playback for video attachments (official,
  # widely-used plugin). Graceful: videos that fail to load show an error state.
  video_player: ^2.9.2
  liquid_glass_widgets: ^0.19.5
  confetti: ^0.8.0
  # C54: settings backup/restore — the .micagobak file is a plain zip.
  archive: ^4.0.0
  shared_preferences: ^2.5.5
  connectivity_plus: ^6.1.5

# C19: file_picker pulls a flutter_plugin_android_lifecycle that demands its
# consumers compile against android-36, conflicting with file_picker's own
# android-34 AAR. Pin the lifecycle plugin to the last android-34 build so the
# dependency set is internally consistent.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.24

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  # Official in-memory platform implementations for credential persistence tests.
  shared_preferences_platform_interface: ^2.4.2
  flutter_secure_storage_platform_interface: ^2.0.1

flutter:

  uses-material-design: true

  assets:
    - lib/Assets/launcher_icons/
    - lib/Assets/MicaGo.png
    - lib/Assets/Server.png
    - lib/Assets/MicaGoC.icon/Assets/shibuya_e50a.png

  fonts:
    - family: MicaGoCompatSymbols
      fonts:
        - asset: lib/Assets/fonts/MicaGoCompatSymbols.ttf

# micaGO build and release pipeline.
#
# Triggers:
#   * Push a version tag like v0.78.0 -> builds every artifact and publishes a
#                                        GitHub Release for that version.
#   * Manual "Run workflow"            -> builds downloadable workflow artifacts
#                                        without publishing a release.
#
# Release artifacts:
#   micaGO-<version>-android-release.apk
#   micaGO-<version>-Windows-release.zip        (native WinUI client)
#   micaGO-<version>-iOS-release-unsigned.ipa
#   micaGO-<version>-Linux-release.tar.gz
#
# The macOS Companion is NOT built here: it is signed, notarized and given its
# Sparkle appcast on a local Mac (MicaGoServer/docs/release-packaging.md), so the
# Developer ID certificate and Sparkle key never live in GitHub. Attach
# micaGO-Companion-<version>-mac.dmg and appcast.xml to the release yourself —
# the Companion's updater reads releases/latest/download/appcast.xml.
#
# Android release signing needs these repository secrets (tag builds fail
# without them; manual runs skip the APK and still analyze + test):
#   ANDROID_KEYSTORE_BASE64    base64-encoded PKCS12/JKS release keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       private-key password
#
# The version comes from MicaGoFlutterClient/pubspec.yaml; a tag build fails
# early if the tag doesn't match it (prevents shipping a stale version).

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Matches the toolchain release builds are verified with locally.
  FLUTTER_VERSION: "3.44.3"

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Read version from pubspec and check the tag matches
        run: |
          PUBSPEC_VERSION="$(grep '^version:' MicaGoFlutterClient/pubspec.yaml | awk '{print $2}')"
          VERSION="${PUBSPEC_VERSION%%+*}"
          BUILD_NUMBER="${PUBSPEC_VERSION##*+}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION. Bump the version files first, then re-tag."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (build $BUILD_NUMBER)"

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: MicaGoFlutterClient
        run: flutter pub get
      - name: Configure release signing
        id: signing
        run: |
          missing=""
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              missing="$missing $value"
            fi
          done
          if [ -n "$missing" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Android release signing secrets are missing:$missing"
              exit 1
            fi
            echo "::warning::Android release signing secrets are not configured (missing:$missing). Skipping the release APK on this manual run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/micago-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          printf '%s\n' \
            "storeFile=$KEYSTORE_PATH" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > MicaGoFlutterClient/android/key.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Analyze
        working-directory: MicaGoFlutterClient
        run: flutter analyze
      - name: Test
        working-directory: MicaGoFlutterClient
        run: flutter test
      - name: Build APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: MicaGoFlutterClient
        run: flutter build apk --release
      - name: Rename artifact
        if: steps.signing.outputs.enabled == 'true'
        run: |
          mkdir -p out
          cp MicaGoFlutterClient/build/app/outputs/flutter-apk/app-release.apk \
            "out/micaGO-${{ needs.meta.outputs.version }}-android-release.apk"
      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    needs: meta
    # The app icon is an Icon Composer `.icon` (MicaGoC), which only Xcode 26+
    # compiles; macos-15's default Xcode 16 fails with "no app icon set named MicaGoC".
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Show Xcode version
        run: xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: MicaGoFlutterClient
        run: flutter pub get
      - name: Build iOS (no codesign)
        working-directory: MicaGoFlutterClient
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p out Payload
          cp -R MicaGoFlutterClient/build/ios/iphoneos/Runner.app Payload/
          zip -qry "out/micaGO-${{ needs.meta.outputs.version }}-iOS-release-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: out/*.ipa
          if-no-files-found: error

  windows:
    name: Windows zip (WinUI client)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Pinned explicitly: the windows-latest image's bundled .NET changes over
      # time, and the client targets net10.0.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Core contract tests
        shell: pwsh
        run: dotnet run --project MicaGoWindowsClient/tests/micaGO.Core.ContractTests/micaGO.Core.ContractTests.csproj -c Release
      - name: Build and package (x64)
        shell: pwsh
        run: ./MicaGoWindowsClient/scripts/package-release-x64.ps1
      - name: Rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item MicaGoWindowsClient/artifacts/micaGO-release-x64.zip `
            "out/micaGO-${{ needs.meta.outputs.version }}-Windows-release.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: out/*.zip
          if-no-files-found: error

  linux:
    name: Linux tar.gz
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: MicaGoFlutterClient
        run: flutter pub get
      - name: Build Linux
        working-directory: MicaGoFlutterClient
        run: flutter build linux --release
      - name: Package tar.gz
        run: |
          mkdir -p out staging
          cp -r MicaGoFlutterClient/build/linux/x64/release/bundle staging/micaGO
          tar -C staging -czf "out/micaGO-${{ needs.meta.outputs.version }}-Linux-release.tar.gz" micaGO
      - uses: actions/upload-artifact@v7
        with:
          name: linux-tarball
          path: out/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [meta, android, ios, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish release assets
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi

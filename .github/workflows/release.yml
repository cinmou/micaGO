# micaGO build and release pipeline.
#
# Triggers:
#   * Push a version tag like v0.87.0 -> builds every artifact and publishes a
#                                        GitHub Release for that version.
#   * Manual "Run workflow"            -> builds downloadable workflow artifacts
#                                        without publishing a release.
#
# Release artifacts:
#   micaGO-<version>-android-release.apk
#   micaGO-<version>-Windows-release.exe        (native WinUI client)
#   micaGO-<version>-Linux-release.tar.gz
#
# The macOS Companion is NOT built here: it is signed, notarized and given its
# Sparkle appcast on a local Mac (docs/DEVELOPMENT.md), so the
# Developer ID certificate and Sparkle key never live in GitHub. Attach
# micaGO-Companion-<version>-mac.dmg and appcast.xml to the release yourself —
# the Companion's updater reads releases/latest/download/appcast.xml.
#
# Android release signing needs these repository secrets (tag builds fail
# without them; manual runs skip the APK and still analyze + test):
#   ANDROID_KEYSTORE_BASE64    base64-encoded PKCS12/JKS release keystore
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       private-key password
#
# The version comes from MicaGoFlutterClient/pubspec.yaml; a tag build fails
# early if the tag doesn't match it (prevents shipping a stale version).

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Matches the toolchain release builds are verified with locally.
  FLUTTER_VERSION: "3.44.3"

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check component versions
        working-directory: ${{ github.workspace }}
        run: python3 scripts/check-versions.py
      - id: v
        name: Read version from pubspec and check the tag matches
        run: |
          PUBSPEC_VERSION="$(grep '^version:' MicaGoFlutterClient/pubspec.yaml | awk '{print $2}')"
          VERSION="${PUBSPEC_VERSION%%+*}"
          BUILD_NUMBER="${PUBSPEC_VERSION##*+}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $VERSION. Bump the version files first, then re-tag."
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (build $BUILD_NUMBER)"

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: MicaGoFlutterClient
        run: flutter pub get
      - name: Analyze
        working-directory: MicaGoFlutterClient
        run: flutter analyze
      - name: Test
        working-directory: MicaGoFlutterClient
        run: flutter test
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              missing="$missing $value"
            fi
          done
          if [ -n "$missing" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Android release signing secrets are missing:$missing"
              exit 1
            fi
            echo "::warning::Android release signing secrets are not configured (missing:$missing). Skipping the release APK on this manual run."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/micago-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          printf '%s\n' \
            "storeFile=$KEYSTORE_PATH" \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            > MicaGoFlutterClient/android/key.properties
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: MicaGoFlutterClient
        run: flutter build apk --release
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/micago-release.jks" MicaGoFlutterClient/android/key.properties
      - name: Rename artifact
        if: steps.signing.outputs.enabled == 'true'
        run: |
          mkdir -p out
          cp MicaGoFlutterClient/build/app/outputs/flutter-apk/app-release.apk \
            "out/micaGO-${{ needs.meta.outputs.version }}-android-release.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.signing.outputs.enabled == 'true'
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer (WinUI client)
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Pinned explicitly: the windows-latest image's bundled .NET changes over
      # time, and the client targets net10.0.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"
      - name: Core contract tests
        shell: pwsh
        run: dotnet run --project MicaGoWindowsClient/tests/micaGO.Core.ContractTests/micaGO.Core.ContractTests.csproj -c Release
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.4.3 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer (x64)
        shell: pwsh
        run: |
          [xml]$props = Get-Content MicaGoWindowsClient/Directory.Build.props
          if ([string]$props.Project.PropertyGroup.MicaGoVersion -ne "${{ needs.meta.outputs.version }}") {
            throw "Windows version does not match release version"
          }
          ./MicaGoWindowsClient/scripts/build-installer-x64.ps1
      - name: Rename artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item MicaGoWindowsClient/artifacts/micaGO-Setup-x64.exe `
            "out/micaGO-${{ needs.meta.outputs.version }}-Windows-release.exe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-installer
          path: out/*.exe
          if-no-files-found: error

  linux:
    name: Linux tar.gz
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Linux desktop build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Pub get
        working-directory: MicaGoFlutterClient
        run: flutter pub get
      - name: Build Linux
        working-directory: MicaGoFlutterClient
        run: flutter build linux --release
      - name: Package tar.gz
        run: |
          mkdir -p out staging
          cp -r MicaGoFlutterClient/build/linux/x64/release/bundle staging/micaGO
          tar -C staging -czf "out/micaGO-${{ needs.meta.outputs.version }}-Linux-release.tar.gz" micaGO
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-tarball
          path: out/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [meta, android, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
            sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Prepare release assets (new releases stay draft until Mac updates are attached)
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release already exists. Review its assets manually; automatic replacement is disabled."
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft \
              --generate-notes \
              --title "$GITHUB_REF_NAME" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY"
          fi
